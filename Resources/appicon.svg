<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2a3f5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2330;stop-opacity:1" />
    </radialGradient>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="92" ry="92" fill="#ffffff" stroke="none"/>
  <rect x="30" y="30" width="452" height="452" rx="80" ry="80" fill="url(#bgGradient)" stroke="none"/>

  <!-- Address book (links): Buchform mit Seiten und Adresszeilen -->
  <g transform="translate(50, 100)">
    <!-- Buchrücken -->
    <rect x="0" y="0" width="32" height="300" rx="6" fill="#b8b8b8"/>
    <!-- Buchdeckel -->
    <rect x="20" y="6" width="180" height="288" rx="10" fill="#d8d8d8"/>
    <!-- Buchseiten (innen, heller) -->
    <rect x="28" y="14" width="164" height="272" rx="6" fill="#f0f0f0"/>
    <!-- Adresszeilen auf den Seiten -->
    <rect x="44" y="60" width="132" height="10" rx="5" fill="#666" opacity="0.5"/>
    <rect x="44" y="100" width="132" height="10" rx="5" fill="#666" opacity="0.5"/>
    <rect x="44" y="180" width="132" height="10" rx="5" fill="#666" opacity="0.5"/>
    <rect x="44" y="220" width="100" height="10" rx="5" fill="#666" opacity="0.5"/>
  </g>

  <!-- Printer (rechts): Gerät mit Papier -->
  <g transform="translate(260, 120)">
    <!-- Papier, das oben rauskommt -->
    <rect x="20" y="-20" width="84" height="70" rx="5" fill="#e0e0e0" opacity="0.6"/>
    <rect x="34" y="0" width="56" height="6" rx="3" fill="#999" opacity="0.5"/>
    <rect x="34" y="20" width="56" height="6" rx="3" fill="#999" opacity="0.5"/>
    <rect x="34" y="40" width="40" height="6" rx="3" fill="#999" opacity="0.5"/>

    <!-- Druckergehäuse -->
    <rect x="0" y="48" width="172" height="160" rx="20" fill="#ffffff"/>
    <!-- Einzugschlitz oben -->
    <rect x="20" y="66" width="132" height="18" rx="6" fill="#2a3f5f" opacity="0.5"/>
    <!-- Papierausgabe unten -->
    <rect x="20" y="128" width="60" height="10" rx="4" fill="#2a3f5f" opacity="0.3"/>
    <!-- Taste -->
    <circle cx="28" cy="168" r="14" fill="#2a3f5f" opacity="0.6"/>
  </g>
</svg>