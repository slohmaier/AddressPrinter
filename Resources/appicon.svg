<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGradient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#2a3f5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a2330;stop-opacity:1" />
    </radialGradient>
  </defs>

  <rect x="18" y="18" width="476" height="476" rx="92" ry="92" fill="#ffffff" stroke="none"/>
  <rect x="30" y="30" width="452" height="452" rx="80" ry="80" fill="url(#bgGradient)" stroke="none"/>

  <!-- ADDRESS BOOK (links): weisser Buch-Umriss mit Adresszeilen -->
  <!-- Buchdeckel -->
  <rect x="60" y="100" width="150" height="290" rx="18" fill="none" stroke="#ffffff" stroke-width="14"/>
  <!-- Buchrücken -->
  <line x1="60" y1="115" x2="60" y2="375" stroke="#ffffff" stroke-width="22" stroke-linecap="round"/>
  <!-- Adresszeilen -->
  <line x1="100" y1="160" x2="200" y2="160" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="100" y1="210" x2="200" y2="210" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="100" y1="260" x2="200" y2="260" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>
  <line x1="100" y1="310" x2="170" y2="310" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.8"/>

  <!-- PRINTER (rechts): weisser Drucker-Umriss mit Papier -->
  <!-- Druckergehäuse -->
  <rect x="280" y="170" width="170" height="200" rx="24" fill="none" stroke="#ffffff" stroke-width="14"/>
  <!-- Papierschlitz oben am Gerät -->
  <line x1="304" y1="190" x2="426" y2="190" stroke="#ffffff" stroke-width="12" stroke-linecap="round" opacity="0.5"/>
  <!-- Papier, das oben rauskommt -->
  <rect x="318" y="70" width="94" height="110" rx="10" fill="none" stroke="#ffffff" stroke-width="14" opacity="0.7"/>
  <!-- Textzeilen auf dem Papier -->
  <line x1="340" y1="100" x2="390" y2="100" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="340" y1="130" x2="390" y2="130" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <line x1="340" y1="160" x2="370" y2="160" stroke="#ffffff" stroke-width="10" stroke-linecap="round" opacity="0.6"/>
  <!-- Taste -->
  <circle cx="300" cy="330" r="16" fill="#ffffff" opacity="0.8"/>
</svg>